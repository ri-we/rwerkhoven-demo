services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME}
      MARIADB_USER: ${WORDPRESS_DB_USER}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${WORDPRESS_PORT}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DEBUG: 1
      # WP_DEVELOPMENT_MODE keeps WordPress from caching the theme's
      # patterns/*.php scan across edits; WP_ENVIRONMENT_TYPE gates the
      # local-only Mailpit SMTP transport in inc/contact-form.php.
      WORDPRESS_CONFIG_EXTRA: "define('WP_DEVELOPMENT_MODE', 'theme'); define('WP_ENVIRONMENT_TYPE', 'local');"
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes/rwerkhoven:/var/www/html/wp-content/themes/rwerkhoven

  # Catches all outgoing mail in local development (web UI on :8025);
  # inc/contact-form.php points PHPMailer here when WP_ENVIRONMENT_TYPE=local.
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"

  wpcli:
    image: wordpress:cli-php8.3
    depends_on:
      - db
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
    volumes:
      - wp_core:/var/www/html
      - ./wp-content/themes/rwerkhoven:/var/www/html/wp-content/themes/rwerkhoven
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  db_data:
  wp_core:
